<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops — Picket</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a class="brand" href="/">Picket</a>
    <nav>
      <a href="/shop">Shop</a>
      <a href="/cart">Cart <span class="cart-count" data-cart-count></span></a>
      <a href="/account">Wallet</a>
      <a href="/admin" data-admin>Ops</a>
      <button class="link" type="button" onclick="picket.onLogout()">Sign out</button>
    </nav>
  </header>
  <main>
    <p class="who" id="who"></p>
    <h1>Ops</h1>
    <p class="lede">Create accounts, set balances, see carts, reset a workspace. Stuck card loads still apply from the customer wallet.</p>
    <p class="err" id="admin-err"></p>
    <section class="card">
      <h2 style="margin-top:0;font-size:1rem;">Create user</h2>
      <form onsubmit="picket.adminCreate(event)">
        <label>Name</label>
        <input name="name" required>
        <label>Email</label>
        <input name="email" type="email" required>
        <label>Password</label>
        <input name="password" type="password" minlength="6" required>
        <label>Balance USD</label>
        <input name="balance_usd" type="number" min="0" step="0.01" value="4.10">
        <p><button type="submit">Create</button></p>
      </form>
    </section>
    <section class="card" style="margin-top:1rem;">
      <h2 style="margin-top:0;font-size:1rem;">Wallets</h2>
      <div id="admin-users"></div>
    </section>
    <section class="card" style="margin-top:1rem;">
      <h2 style="margin-top:0;font-size:1rem;">Catalog</h2>
      <table>
        <thead>
          <tr><th>SKU</th><th>Name</th><th>Price</th><th>Set USD</th></tr>
        </thead>
        <tbody id="catalog-body"></tbody>
      </table>
    </section>
    <section class="card" style="margin-top:1rem;">
      <h2 style="margin-top:0;font-size:1rem;">Recent orders</h2>
      <table>
        <thead>
          <tr><th>Account</th><th>PO</th><th>Item</th><th>Amount</th></tr>
        </thead>
        <tbody id="order-body"></tbody>
      </table>
    </section>
  </main>
  <footer>
    © 2026 Picket
    · <a href="https://github.com/brian-reimbursor/picket">Developed by Reimbursor</a>
  </footer>
  <script src="/static/app.js"></script>
  <script>picket.loadAdmin();</script>
</body>
</html>
