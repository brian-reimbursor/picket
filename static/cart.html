<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — Picket</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a class="brand" href="/">Picket</a>
    <nav>
      <a href="/shop">Shop</a>
      <a href="/cart">Cart <span class="cart-count" data-cart-count></span></a>
      <a href="/account">Wallet</a>
      <a href="/billing">Add funds</a>
      <a href="/admin" data-admin>Ops</a>
      <button class="link" type="button" onclick="picket.onLogout()">Sign out</button>
    </nav>
  </header>
  <main>
    <p class="who" id="who"></p>
    <h1>Cart</h1>
    <p class="lede">Items stay here until you check out or remove them.</p>
    <section class="card">
      <table>
        <thead>
          <tr><th>Item</th><th>Price</th><th></th></tr>
        </thead>
        <tbody id="cart-body"></tbody>
      </table>
      <p class="cart-total">Total <strong id="cart-total">$0.00</strong></p>
      <p>
        <button type="button" id="cart-checkout">Checkout</button>
        <a class="btn ghost" href="/shop">Keep shopping</a>
      </p>
      <p class="err" id="cart-err"></p>
    </section>
  </main>
  <footer>
    © 2026 Picket
    · <a href="https://github.com/brian-reimbursor/picket">Developed by Reimbursor</a>
  </footer>
  <script src="/static/app.js"></script>
  <script>picket.loadCart();</script>
</body>
</html>
