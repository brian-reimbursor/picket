<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Picket</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a class="brand" href="/">Picket</a>
    <nav>
      <a href="/shop">Shop</a>
      <a href="/cart">Cart <span class="cart-count" data-cart-count></span></a>
      <a href="/account">Wallet</a>
      <a href="/billing">Add funds</a>
      <a href="/admin" data-admin>Ops</a>
      <button class="link" type="button" onclick="picket.onLogout()">Sign out</button>
    </nav>
  </header>
  <main>
    <p class="who" id="who"></p>
    <section class="card wallet-strip">
      <div class="tag">wallet</div>
      <p class="balance" id="balance">—</p>
      <p>USD available. Orders ship to the office on file.</p>
    </section>
    <h1>Shop</h1>
    <p class="lede">Add a piece, then open <a href="/cart">Cart</a> to drop it or check out.</p>
    <div class="products" id="products"></div>
  </main>
  <footer>
    © 2026 Picket
    · <a href="https://github.com/brian-reimbursor/picket">Developed by Reimbursor</a>
  </footer>
  <script src="/static/app.js"></script>
  <script>picket.loadShop();</script>
</body>
</html>
